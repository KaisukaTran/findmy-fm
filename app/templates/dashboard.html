<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FINDMY-FM · {{ mode.label }}</title>
  {# htmx injects its own <style> for .htmx-indicator, which this app's CSP
     (style-src 'self') blocks with a console error on every page load. We already
     define those rules ourselves in style.css, so the injected copy is redundant.
     Set through a meta tag, not JS: app.js is deferred BEFORE htmx.min.js, so
     htmx.config does not exist yet when app.js runs.
     allowEval=false stops htmx probing for the Function constructor at start-up,
     which the same CSP blocks and which logged an EvalError on every page load. The
     app uses none of the features that need it: no hx-vals/hx-headers with js:, no
     hx-on attributes, and the hx-trigger [...] filters were removed because they
     could never have run under this CSP anyway. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}' />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/style.css?v={{ asset_v }}" />
  <script defer src="/static/app.js?v={{ asset_v }}"></script>
  <script defer src="/static/htmx.min.js"></script>
  <script defer src="/static/alpine.min.js"></script>
</head>
<body class="env-{{ mode.env }}">
  <header>
    <h1>FINDMY-FM <span class="muted">· KSS Pyramid DCA</span>
      <span class="badge {{ mode.cls }}" title="Chế độ của instance này — Paper :8000 / Live :8001. Không nhầm hai bảng điều khiển.">{{ mode.label }}</span></h1>
    <div hx-get="/partials/status" hx-trigger="load, every 5s, refresh-status from:body" hx-swap="innerHTML"></div>
    <div class="actions">
      <span id="key-indicator" class="key-indicator" title="" data-action="clearKey"></span>
    </div>
  </header>

  <main>
    <div class="layout">
      <!-- Left sidebar nav. data-tab drives app.js showTab — presentation-only,
           no JS change: showTab toggles .active on [data-tab] and shows the panel. -->
      <aside class="sidebar">
        <nav class="sidebar-nav" role="tablist" aria-label="Điều hướng">
          <button class="tab active" data-tab="overview" role="tab" aria-selected="true"><span class="nav-ico" aria-hidden="true">▦</span><span>Tổng quan</span></button>
          <button class="tab" data-tab="trading" role="tab" aria-selected="false"><span class="nav-ico" aria-hidden="true">⇅</span><span>Giao dịch</span></button>
          <button class="tab" data-tab="opus" role="tab" aria-selected="false"><span class="nav-ico" aria-hidden="true">◈</span><span>OPUS</span></button>
          <button class="tab" data-tab="losses" role="tab" aria-selected="false"><span class="nav-ico" aria-hidden="true">⚠</span><span>Phân tích lỗ</span></button>
          <button class="tab" data-tab="calendar" role="tab" aria-selected="false"><span class="nav-ico" aria-hidden="true">⊞</span><span>Lịch P&amp;L</span></button>
          <button class="tab" data-tab="costs" role="tab" aria-selected="false"><span class="nav-ico" aria-hidden="true">₫</span><span>Chi phí</span></button>
          <button class="tab" data-tab="savings" role="tab" aria-selected="false"><span class="nav-ico" aria-hidden="true">◆</span><span>Tích trữ</span></button>
          <button class="tab" data-tab="strategy" role="tab" aria-selected="false"><span class="nav-ico" aria-hidden="true">⚙</span><span>Chiến lược</span></button>
          <button class="tab" data-tab="logs" role="tab" aria-selected="false"><span class="nav-ico" aria-hidden="true">☰</span><span>Nhật ký</span></button>
        </nav>
      </aside>
      <div class="content">

    <!-- Summary cards (KPI strip — overview only; all detail stays in tables) -->
    <div hx-get="/partials/summary" hx-trigger="load, every 15s, refresh-status from:body" hx-swap="innerHTML">
      <span class="htmx-indicator loading-row">Đang tải…</span>
    </div>

    <!-- TAB: Tổng quan (Overview) -->
    <div data-tab-panel="overview">
      <!-- Capital-allocation bar (backup / free / resting / deployed / promised). -->
      <div hx-get="/partials/capital" hx-trigger="load, tab-shown from:closest [data-tab-panel], every 15s, refresh-trading from:body" hx-swap="innerHTML"></div>
      <div class="panel mt-16">
        <h2>Hiệu suất (Performance)</h2>
        <!-- Initial lazy load only; the returned #perf partial owns its own polling
             so the period toggle survives refreshes (it bakes ?period into its hx-get). -->
        <div hx-get="/partials/performance" hx-trigger="load, tab-shown from:closest [data-tab-panel]" hx-swap="innerHTML"></div>
      </div>
      <div class="panel mt-16">
        <h2>Agent Scanner</h2>
        <div class="scroll" hx-get="/partials/scanner" hx-trigger="load, tab-shown from:closest [data-tab-panel], every 30s, refresh-scanner from:body" hx-swap="innerHTML"></div>
        <div hx-get="/partials/scanner-stats" hx-trigger="load, tab-shown from:closest [data-tab-panel], every 30s, refresh-scanner from:body" hx-swap="innerHTML"></div>
      </div>
    </div>

    <!-- TAB: Giao dịch (Trading) -->
    <div data-tab-panel="trading">
      <!-- Capital-allocation bar (backup / free / resting / deployed / promised). -->
      <div hx-get="/partials/capital" hx-trigger="load, tab-shown from:closest [data-tab-panel], every 15s, refresh-trading from:body" hx-swap="innerHTML"></div>
      <!-- 2×2 cards: top = KSS + Positions, bottom = Pending + Trades (≤20 rows each).
           KSS sits top-left (the primary manage/DCA+ surface); Pending moved below it. -->
      <div class="grid grid-2 mt-16">
        <div class="panel">
          <h2>KSS Sessions</h2>
          <div class="scroll"
               hx-get="/partials/kss"
               hx-trigger="tab-shown from:closest [data-tab-panel], load"
               hx-swap="innerHTML"><span class="htmx-indicator loading-row">Đang tải…</span></div>
        </div>
        <div class="panel">
          <h2>Vị thế (Positions)</h2>
          <div class="scroll"
               hx-get="/partials/positions"
               hx-trigger="tab-shown from:closest [data-tab-panel], load"
               hx-swap="innerHTML"></div>
        </div>
        <div class="panel">
          <h2>Hàng chờ duyệt (Pending)</h2>
          <div class="scroll"
               hx-get="/partials/pending"
               hx-trigger="tab-shown from:closest [data-tab-panel], load"
               hx-swap="innerHTML"><span class="htmx-indicator loading-row">Đang tải…</span></div>
        </div>
        <div class="panel">
          <h2>Lịch sử giao dịch (Trades)</h2>
          <div class="scroll"
               hx-get="/partials/trades"
               hx-trigger="tab-shown from:closest [data-tab-panel], load"
               hx-swap="innerHTML"></div>
        </div>
      </div>
    </div>

    <!-- TAB: OPUS orchestrator mode -->
    <div data-tab-panel="opus">
      <div class="panel mt-16">
        <h2>OPUS orchestrator (Opus tự điều phối · paper)</h2>
        <div hx-get="/partials/opus" hx-trigger="tab-shown from:closest [data-tab-panel], every 10s, refresh-opus from:body" hx-swap="innerHTML"></div>
      </div>
    </div>

    <!-- TAB: Phân tích lỗ (Loss analysis — for strategy improvement) -->
    <div data-tab-panel="losses">
      <div class="panel mt-16">
        <h2>Phân tích lỗ — nguyên nhân / thời gian / giá trị / cặp</h2>
        <div hx-get="/partials/losses" hx-trigger="tab-shown from:closest [data-tab-panel], every 30s, refresh-losses from:body" hx-swap="innerHTML"></div>
      </div>
    </div>

    <!-- TAB: Lịch P&L (PnL Calendar) — realized PnL by day/week/month -->
    <div data-tab-panel="calendar">
      <div class="panel mt-16">
        <h2>Lịch lãi/lỗ đã chốt (PnL Calendar)</h2>
        <div id="calendar-wrap" hx-get="/partials/calendar" hx-trigger="tab-shown from:closest [data-tab-panel]" hx-swap="innerHTML"><span class="htmx-indicator loading-row">Đang tải…</span></div>
      </div>
    </div>

    <!-- TAB: Chi phí (operating costs — trade/withdraw/VAT/AI) -->
    <div data-tab-panel="costs">
      <div class="panel mt-16">
        <h2>Chi phí vận hành</h2>
        <div hx-get="/partials/costs?period=month"
             hx-trigger="tab-shown from:closest [data-tab-panel], load"
             hx-swap="innerHTML"><span class="htmx-indicator loading-row">Đang tải…</span></div>
      </div>
    </div>

    <!-- TAB: Tích trữ (KAI savings — protected holdings the bot never sells) -->
    <div data-tab-panel="savings">
      <div class="panel mt-16">
        <h2>Tích trữ (KAI) — bot không bán</h2>
        <div hx-get="/partials/savings"
             hx-trigger="tab-shown from:closest [data-tab-panel], load"
             hx-swap="innerHTML"><span class="htmx-indicator loading-row">Đang tải…</span></div>
      </div>
    </div>

    <!-- TAB: Chiến lược (Strategy / Params) -->
    <div data-tab-panel="strategy">
      <div class="grid mt-16">
        <div class="panel">
          <h2>Cấu hình KSS (tổng)</h2>
          <!-- load once only: a global refresh must NOT reload the form while the user is
               editing (it would clobber unsaved input). Saving keeps the typed values. -->
          <div hx-get="/partials/kss-settings" hx-trigger="load" hx-swap="innerHTML"></div>
        </div>
        <div class="panel">
          <h2>Go-live (PAPER / LIVE)</h2>
          <div hx-get="/partials/live-trading" hx-trigger="load, tab-shown from:closest [data-tab-panel], refresh-live from:body, refresh-status from:body" hx-swap="innerHTML"></div>
        </div>
      </div>
    </div>

    <!-- TAB: Nhật ký (Logs) — meaningful, categorised activity feed. Category filtering is
         SERVER-SIDE (each tab fetches its 20 most-recent events), so a sparse category is
         never hidden behind a window of scan noise. Buttons live inside the polled partial. -->
    <div data-tab-panel="logs">
      <div class="panel mt-16">
        <h2>Nhật ký hoạt động</h2>
        <div id="audit-wrap">
          <!-- symbol filter indicator stays OUTSIDE the swap so its JS state survives polls -->
          <div class="audit-filters">
            <span id="audit-sym-filter" class="hidden">· coin: <b id="audit-sym-label"></b>
              <button class="sm ghost" data-action="auditClearSymbol">✕ bỏ lọc</button></span>
          </div>
          <div class="scroll"
               hx-get="/partials/audit?category=important"
               hx-trigger="tab-shown from:closest [data-tab-panel], load"
               hx-swap="innerHTML"><span class="htmx-indicator loading-row">Đang tải…</span></div>
        </div>
      </div>
    </div>
      </div><!-- /.content -->
    </div><!-- /.layout -->
  </main>

  <!-- Click-to-view price ladder modal (plain JS — works on HTMX-swapped rows) -->
  <div id="ladder-modal" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="overlay-box">
      <button class="sm ghost float-right" data-action="closeLadder" aria-label="Đóng">✕</button>
      <div id="ladder-body"></div>
    </div>
  </div>
</body>
</html>
