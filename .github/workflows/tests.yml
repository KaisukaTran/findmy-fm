name: Tests & Code Quality

on:
  push:
    branches: [ main, develop, live ]
  pull_request:
    branches: [ main, develop, live ]

# Least privilege for every job's GITHUB_TOKEN.
permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (a tag can be moved to other code); the
# trailing comment names the release. Dependabot (.github/dependabot.yml) proposes bumps.
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 dropped: dev deps (ipython 9.x / jupyterlab) require Python >=3.11,
        # and the app/prod image targets 3.12.
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    # Lint/format/type are non-blocking for now: the lean rebuild lives in app/ and
    # is not yet ruff/black-clean (32 cosmetic ruff issues). TODO: re-enable as
    # blocking once app/ is swept. The app test suite below is the real gate.
    - name: Lint with ruff
      continue-on-error: true
      run: |
        ruff check app/ tests/app scripts/

    - name: Format check with black
      continue-on-error: true
      run: |
        black --check app/ tests/app scripts/

    - name: Type check with mypy
      run: |
        mypy app/ --ignore-missing-imports
      continue-on-error: true

    - name: Run tests with pytest
      run: |
        pytest tests/app -o addopts="" -o asyncio_mode=auto -p no:cacheprovider -v

  # Known-vulnerability gate on what actually ships: the runtime list, resolved fresh.
  # Blocking — a new advisory against a runtime dependency fails the build. Dev tooling
  # (jupyter, sphinx, …) is deliberately out of scope: it never runs in the app.
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: Audit runtime dependencies
      run: |
        python -m pip install pip-audit==2.10.1
        pip-audit -r requirements-app.txt --desc

  # Report-only static scan (as before). Runs bandit directly at a pinned version: the
  # PyCQA/bandit-action wrapper pulls unpinned sub-actions + an unpinned bandit and ends in
  # `|| true`, so pinning it bought nothing.
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: Run Bandit security check
      continue-on-error: true
      run: |
        python -m pip install "bandit[toml]==1.9.4"
        bandit -r app/ -ll
